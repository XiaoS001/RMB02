name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法编译检查
        run: |
          python -m compileall -q app.py models.py config.py auth.py api.py \
            generator.py validator.py runner.py scorer.py stability.py \
            report.py annotation.py dashboard.py contract_extractor.py pages.py

      - name: 跑测试
        run: python -m pytest tests -q -p no:warnings

      - name: 密钥扫描（代码里不许有明文 key）
        run: |
          if grep -rnE "sk-[A-Za-z0-9]{16,}|rc-[A-Za-z0-9]{30,}|api_key[[:space:]]*=[[:space:]]*['\"]" \
               --include='*.py' --include='*.yml' --include='*.json' \
               --exclude-dir=venv --exclude-dir=.git .; then
            echo "::error::检测到疑似明文密钥"
            exit 1
          fi
          echo "✅ 未发现明文密钥"

      - name: 业务库未被测试污染
        run: |
          if git status --porcelain | grep -q '\.db$'; then
            echo "::error::测试写出了 .db 文件（应被 .gitignore 排除）"
            git status --porcelain | grep '\.db$'
            exit 1
          fi
          echo "✅ 业务库未被污染"

  docker-build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rmb02:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-run:
    name: 容器冒烟（真跑起来）
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t rmb02:smoke .

      - name: 起容器
        run: |
          mkdir -p /tmp/rmb02-data
          chmod 777 /tmp/rmb02-data
          docker run -d --name rmb02-smoke \
            -p 5102:5102 \
            -e RMB02_PORT=5102 \
            -e RMB02_DATA_DIR=/app/data \
            -v /tmp/rmb02-data:/app/data \
            rmb02:smoke

      - name: 等待健康检查通过
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5102/healthz; then
              echo ""
              echo "✅ 健康检查通过（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 容器 30 次重试内未就绪"
          docker logs rmb02-smoke
          exit 1

      - name: 验证非 root 运行
        run: |
          user=$(docker exec rmb02-smoke id -un)
          uid=$(docker exec rmb02-smoke id -u)
          echo "容器内用户: $user (uid=$uid)"
          test "$user" = "appuser" || { echo "❌ 期望 appuser，实际 $user"; exit 1; }

      - name: 验证容器内能写库（非 root 权限的实际检验）
        run: |
          docker exec rmb02-smoke python -c "
          from app import app
          from models import Target, db
          with app.app_context():
              t = Target(name='容器冒烟', base_url='offline://demo', kind='offline')
              db.session.add(t); db.session.commit()
              tid = t.id
              assert db.session.get(Target, tid) is not None
          print('✅ 容器内数据库可读写, target id =', tid)
          "

      - name: 验证页面与鉴权
        run: |
          curl -fsS http://127.0.0.1:5102/ > /dev/null && echo "✅ / 200"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5102/api/targets)
          echo "未登录访问 /api/targets -> HTTP $code（期望 401）"
          test "$code" = "401" || { echo "❌ 期望 401"; exit 1; }

      - name: 容器日志
        if: always()
        run: docker logs rmb02-smoke 2>&1 | tail -30 || true

      - name: 清理
        if: always()
        run: docker rm -f rmb02-smoke || true
