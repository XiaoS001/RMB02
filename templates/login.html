{% extends "base.html" %}
{% block title %}登录 · RMB02{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:3rem auto;">
  <h1>登录</h1>
  <div class="row" style="margin-bottom:0.75rem;">
    <input id="username" placeholder="用户名" style="flex:1;">
  </div>
  <div class="row">
    <input id="password" type="password" placeholder="密码" style="flex:1;">
  </div>
  <div class="error" id="err" style="display:none;"></div>
  <div class="row" style="margin-top:1rem;">
    <button onclick="doLogin()">登录</button>
  </div>
  <p class="muted" style="margin-top:1rem;">演示账号：eval / eval123456（评测工程师）· annotator / annot123456（标注员）· client / client123456（客户只读）</p>
</div>
<script>
async function doLogin() {
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: document.getElementById('username').value,
                          password: document.getElementById('password').value}),
  });
  if (r.ok) { location = '/dashboard'; }
  else {
    const d = await r.json();
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = d.error || '登录失败';
  }
}
</script>
{% endblock %}
